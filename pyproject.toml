[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "numpy-llm"
version = "0.1.0"
description = "Pequeño modelo de lenguaje autorregresivo Transformer decoder-only, implementado en Python y NumPy con fines educativos."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy"]

[tool.setuptools.packages.find]
where = ["src"]
